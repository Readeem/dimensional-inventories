plugins {
	id 'dev.architectury.loom' version "${loom_version}"
	id 'maven-publish'
}

def targetJavaVersion = Integer.parseInt(project.target_java_version)
def javaVersionString = "JAVA_" + targetJavaVersion.toString()

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def interactiveRunPath = "run/interactive"
def interactiveServerRunPath = interactiveRunPath + "/server"
def interactiveClientRunPath = interactiveRunPath + "/client"

loom {
	silentMojangMappingsLicense()

	mods {
		"dimensional-inventories" {
			sourceSet sourceSets.main
		}
	}

	runs {
		server {
			runDir(interactiveServerRunPath)
		}

		client {
			runDir(interactiveClientRunPath)
		}
	}
}

tasks.register("acceptInteractiveServerEula") {
	doLast {
		mkdir(interactiveServerRunPath)
		new File(interactiveServerRunPath, "eula.txt").text = "eula=true"
	}
}

tasks.register("creativeDimensionDatapackZip", Zip) {
    group = "build"
    from "./src/main/datapacks/example"
    archiveBaseName = "creative-dimension"
    archiveVersion = project.minecraft_version

    inputs.property("minecraft_version", project.minecraft_version)
    inputs.property("data_pack_format", project.data_pack_format)

    filter { String line ->
        line.replace("\${data_pack_format}", project.data_pack_format)
    }
}

tasks.build {
	dependsOn(creativeDimensionDatapackZip)
}

tasks.javadoc {
	source += sourceSets.test.allJava
}

runClient.configure {
	dependsOn(build)
}

runServer.configure {
	dependsOn(build)
	dependsOn(acceptInteractiveServerEula)
}

repositories {
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases/'
	}
	maven {
		name = 'TheIllusiveC4'
		url = 'https://maven.theillusivec4.top/'
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	neoForge "net.neoforged:neoforge:${project.neoforge_version}"

	// Google Gson for JSON parsing and writing
	api "com.google.code.gson:gson:${project.gson_version}"

	// Apache Commons IO to move entire directories
	implementation "commons-io:commons-io:${project.apache_commons_io_version}"

	// Curios API for optional accessory slot compatibility
	modCompileOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"

}

tasks.withType(ProcessResources).configureEach {
	inputs.property("java_version", project.target_java_version)
	inputs.property("version", project.version)
	inputs.property("minecraft_version", project.minecraft_version)
	inputs.property("curios_version", project.curios_version)
	filteringCharset = "UTF-8"

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "java_version": project.target_java_version,
				"version": project.version,
				"minecraft_version": project.minecraft_version,
				"neoforge_version": project.neoforge_version,
				"curios_version": project.curios_version
	}

	filesMatching("*.mixins.json") {
		expand "java_version": javaVersionString
	}
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"
	if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
		it.options.release.set(targetJavaVersion)
	}
}

tasks.withType(Jar).configureEach {
	if (!it.name.endsWith("sourcesJar"))
	{
		exclude("**/*.xcf")
	}
}

java {
	def javaVersion = JavaVersion.toVersion(targetJavaVersion)
	if (JavaVersion.current() < javaVersion) {
		toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	withJavadocJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = base.archivesName
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
